name: Bi-sync Issues

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, assigned, unassigned, milestoned, demilestoned]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: bisync-${{ github.repository }}-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App installation token (cross-repo)
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ vars.SYNC_APP_OWNER }}
          repositories: ${{ vars.SYNC_REPOS }}

      - name: Bi-sync issues & comments
        uses: actions/github-script@v7
        env:
          SYNC_PEER_REPO: ${{ vars.SYNC_PEER_REPO }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            // github-script@v7 已注入：core / github / context

            const peerRepoFull = process.env.SYNC_PEER_REPO; // e.g. "xiaoheiCat/repoB"
            if (!peerRepoFull || !peerRepoFull.includes("/")) {
              core.setFailed("Missing/invalid vars.SYNC_PEER_REPO (expected owner/repo).");
              return;
            }
            const [peerOwner, peerRepo] = peerRepoFull.split("/");

            const srcOwner = context.repo.owner;
            const srcRepo  = context.repo.repo;

            const payloadIssue = context.payload.issue;
            if (!payloadIssue) {
              core.info("No issue in event payload; nothing to do.");
              return;
            }

            const isCommentEvent = !!context.payload.comment;
            const isIssueEvent = !isCommentEvent;

            // ---------- 同步标记 ----------
            // 映射：<!-- sync-peer:owner/repo#123 -->
            // 防循环：<!-- sync-write:... -->
            const PEER_PREFIX = "<!-- sync-peer:";
            const PEER_SUFFIX = "-->";
            const WRITE_TAG_PREFIX = "<!-- sync-write:";
            const WRITE_TAG_RE = /<!--\s*sync-write:[\s\S]*?-->/g;

            function buildPeerMark(owner, repo, number) {
              return `${PEER_PREFIX}${owner}/${repo}#${number}${PEER_SUFFIX}`;
            }

            function extractPeerFromBody(body) {
              if (!body) return null;
              const re = /<!--\s*sync-peer:([A-Za-z0-9_.-]+)\/([A-Za-z0-9_.-]+)#(\d+)\s*-->/;
              const m = body.match(re);
              if (!m) return null;
              return { owner: m[1], repo: m[2], number: Number(m[3]) };
            }

            function hasSyncWriteTag(text) {
              if (!text) return false;
              return /<!--\s*sync-write:/.test(text);
            }

            // ✅ 防循环：按事件类型判断（避免“评论永远不同步”）
            if (isCommentEvent) {
              if (hasSyncWriteTag(context.payload.comment?.body)) {
                core.info("Skip: comment contains sync-write tag.");
                return;
              }
            } else {
              if (hasSyncWriteTag(payloadIssue.body)) {
                core.info("Skip: issue body contains sync-write tag.");
                return;
              }
            }

            // ---------- API helpers ----------
            async function getIssue(owner, repo, number) {
              const { data } = await github.rest.issues.get({ owner, repo, issue_number: number });
              return data;
            }
            async function updateIssue(owner, repo, number, patch) {
              await github.rest.issues.update({ owner, repo, issue_number: number, ...patch });
            }
            async function createIssue(owner, repo, payload) {
              const { data } = await github.rest.issues.create({ owner, repo, ...payload });
              return data;
            }
            async function listAllComments(owner, repo, number) {
              const all = [];
              let page = 1;
              while (true) {
                const { data } = await github.rest.issues.listComments({
                  owner, repo, issue_number: number, per_page: 100, page
                });
                all.push(...data);
                if (data.length < 100) break;
                page++;
              }
              return all;
            }

            function normalizeLabels(issue) {
              return (issue.labels || []).map(l => (typeof l === "string" ? l : l.name)).filter(Boolean);
            }
            function normalizeAssignees(issue) {
              return (issue.assignees || []).map(a => a.login).filter(Boolean);
            }
            function milestoneNumber(issue) {
              return issue.milestone ? issue.milestone.number : null;
            }

            // ---------- 取最新源 issue ----------
            const srcNumber = payloadIssue.number;
            const freshSrc = await getIssue(srcOwner, srcRepo, srcNumber);

            const runWriteTag = `${WRITE_TAG_PREFIX}${srcOwner}/${srcRepo}#${srcNumber} run:${context.runId} -->`;

            function stripWriteTags(text) {
              if (!text) return text;
              return text.replace(WRITE_TAG_RE, "").trim();
            }

            function ensureMarksOnBody(body, mappingMark, writeTag) {
              let b = body || "";
              if (!b.includes(mappingMark)) b = `${b}\n\n${mappingMark}\n`;
              if (!b.includes(writeTag)) b = `${b}\n${writeTag}\n`;
              return b.trim();
            }

            function authorPrefixFromUser(user) {
              const login = user?.login || "unknown";
              const url = user?.html_url || `https://github.com/${login}`;
              return `[${login}](${url}): `;
            }

            function syncedFromLine(owner, repo, number) {
              return `> Synced from ${owner}/${repo}#${number}`;
            }

            // ---------- 找/建对端 ----------
            let peerRef = extractPeerFromBody(freshSrc.body);
            let peerIssue;

            if (!peerRef) {
              core.info("No peer mapping found. Creating peer issue...");

              const mappingBackToSrc = buildPeerMark(srcOwner, srcRepo, srcNumber);

              const srcAuthorPrefix = authorPrefixFromUser(freshSrc.user);
              const cleanBody = stripWriteTags(freshSrc.body || "");

              // ✅ 对端新建 Issue 的 body：作者前缀 + 原文 + Synced from +（末尾映射/写入标记）
              const createBodyMain = [
                `${srcAuthorPrefix}`,
                "",
                `${cleanBody}`,
                "",
                "---",
                `${syncedFromLine(srcOwner, srcRepo, srcNumber)}`
              ].join("\n").trim();

              const createBody = ensureMarksOnBody(
                createBodyMain,
                mappingBackToSrc,
                `${WRITE_TAG_PREFIX}${srcOwner}/${srcRepo}#${srcNumber} create run:${context.runId} -->`
              );

              const createPayload = { title: freshSrc.title, body: createBody };

              // 这些可能因对端不存在/权限策略失败，做容错
              try { createPayload.labels = normalizeLabels(freshSrc); } catch {}
              try { createPayload.assignees = normalizeAssignees(freshSrc); } catch {}
              try {
                const ms = milestoneNumber(freshSrc);
                if (ms) createPayload.milestone = ms;
              } catch {}

              peerIssue = await createIssue(peerOwner, peerRepo, createPayload);

              // 写回源 issue 的映射（注意：会写入 sync-write，这是正常的）
              const mappingToPeer = buildPeerMark(peerOwner, peerRepo, peerIssue.number);
              const newSrcBody = ensureMarksOnBody(stripWriteTags(freshSrc.body || ""), mappingToPeer, runWriteTag);
              await updateIssue(srcOwner, srcRepo, srcNumber, { body: newSrcBody });

              peerRef = { owner: peerOwner, repo: peerRepo, number: peerIssue.number };
              core.info(`Created peer: ${peerOwner}/${peerRepo}#${peerIssue.number}`);
            } else {
              peerIssue = await getIssue(peerRef.owner, peerRef.repo, peerRef.number);
              core.info(`Found peer: ${peerRef.owner}/${peerRef.repo}#${peerRef.number}`);
            }

            // ---------- 同步 Issue 字段（源 -> 目标） ----------
            async function syncIssueFields(src, dstRef) {
              const mappingBackToSrc = buildPeerMark(srcOwner, srcRepo, srcNumber);

              const authorPrefix = authorPrefixFromUser(src.user);
              const cleanBody = stripWriteTags(src.body || "");

              // ✅ 对端 body 每次都重建：作者前缀 + 原文 + Synced from + 标记
              const main = [
                `${authorPrefix}`,
                "",
                `${cleanBody}`,
                "",
                "---",
                `${syncedFromLine(srcOwner, srcRepo, srcNumber)}`
              ].join("\n").trim();

              const newDstBody = ensureMarksOnBody(main, mappingBackToSrc, runWriteTag);

              const patch = {
                title: src.title,
                body: newDstBody,
                state: src.state
              };

              // 容错：不影响主同步
              try { patch.labels = normalizeLabels(src); } catch (e) { core.info(`labels sync skipped: ${e.message}`); }
              try { patch.assignees = normalizeAssignees(src); } catch (e) { core.info(`assignees sync skipped: ${e.message}`); }
              try { patch.milestone = milestoneNumber(src); } catch (e) { core.info(`milestone sync skipped: ${e.message}`); }

              await updateIssue(dstRef.owner, dstRef.repo, dstRef.number, patch);
            }

            // ---------- 同步评论（增量去重 + 作者前缀） ----------
            function commentTag(srcCommentId) {
              return `<!-- sync-comment-id:${srcCommentId} -->`;
            }

            async function syncComments(srcRef, dstRef) {
              const srcComments = await listAllComments(srcRef.owner, srcRef.repo, srcRef.number);
              const dstComments = await listAllComments(dstRef.owner, dstRef.repo, dstRef.number);

              const dstJoined = dstComments.map(c => c.body || "").join("\n");

              for (const c of srcComments) {
                // 源评论若为同步写入则不再同步（防循环）
                if (hasSyncWriteTag(c.body || "")) continue;

                const tag = commentTag(c.id);
                if (dstJoined.includes(tag)) continue;

                const authorPrefix = authorPrefixFromUser(c.user);

                const body = [
                  `${authorPrefix}`,
                  "",
                  `${c.body || ""}`,
                  "",
                  "---",
                  `${syncedFromLine(srcRef.owner, srcRef.repo, srcRef.number)}`,
                  `${tag}`,
                  `${WRITE_TAG_PREFIX}${srcRef.owner}/${srcRef.repo}#${srcRef.number} comment run:${context.runId} -->`
                ].join("\n").trim();

                await github.rest.issues.createComment({
                  owner: dstRef.owner,
                  repo: dstRef.repo,
                  issue_number: dstRef.number,
                  body
                });
              }
            }

            const srcRef = { owner: srcOwner, repo: srcRepo, number: srcNumber };
            const dstRef = { owner: peerRef.owner, repo: peerRef.repo, number: peerRef.number };

            // 每次事件都：先对齐 issue 字段，再补齐评论（最稳）
            await syncIssueFields(freshSrc, dstRef);
            await syncComments(srcRef, dstRef);

            core.info(`Done: ${srcOwner}/${srcRepo}#${srcNumber} <-> ${dstRef.owner}/${dstRef.repo}#${dstRef.number}`);
