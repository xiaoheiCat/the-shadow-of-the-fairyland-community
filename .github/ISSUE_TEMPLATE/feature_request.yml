name: ✨ Feature Request / 功能请求
description: 提交新功能建议或改进想法 | Suggest a new feature or improvement
title: "[Feature] 简要描述需求 | Brief request"
labels:
  - enhancement
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## Feature Request / 功能请求
        感谢你参与本 Mod 未来内容的设计！
        请尽量描述清楚你的设想，以便我们评估可行性、实现成本与平衡性。
        Thanks for participating in the design of this Mod's future content!
        Please provide enough detail for evaluation and balance consideration.

  - type: textarea
    id: problem
    attributes:
      label: 需求背景 / Problem Statement
      description: |
        这个功能想解决什么玩法上的问题？
        What gameplay problem does this feature address?
      placeholder: |
        例如：修炼过程过于单调、某境界缺乏存在感、玩法断层等。 / For example: the cultivation process is overly monotonous, certain realms lack a sense of presence, and there is a disconnect in gameplay, etc.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 方案设想 / Proposed Solution
      description: |
        你希望这个功能具体如何实现？
        可以描述机制、交互方式、触发条件或大致规则。
        Describe how you expect this feature to work in-game.
      placeholder: |
        例如：新的修炼机制 / 进度条、特定条件触发突破或事件、新物品 / 方块 / 状态效果等。 / For example: new cultivation mechanics/progress bars, breakthroughs or events triggered by specific conditions, new items/blocks/status effects, etc.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / Alternatives Considered
      description: |
        是否考虑过其他实现方式或现有机制的改动？
        Why are those alternatives less suitable?
      placeholder: |
        例如：直接数值增强但不够有趣、复用现有系统但缺乏修仙味道等。 / For example: direct numerical boosts that lack fun, reusing existing systems without capturing the immortal cultivation vibe, and so on.

  - type: dropdown
    id: priority
    attributes:
      label: 优先级 / Priority
      description: |
        你认为该功能在修仙体系中的重要程度？
        How important is this feature?
      options:
        - 核心修仙体验 / Core cultivation experience
        - 重要玩法补充 / Important enhancement
        - 一般扩展 / Nice to have
        - 低优先级 / Low priority
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围 / Scope
      description: |
        该功能主要涉及模组的哪一部分？
        Which area of the mod is mainly affected?
      options:
        - 修炼系统 / Cultivation system
        - 境界与突破 / Realms & breakthrough
        - 功法 & 技能 / Techniques & skills
        - 法宝 & 装备 / Artifacts & equipment
        - 战斗 / Combat
        - 世界生成 / World generation
        - UI & 数值 & 平衡 / UI, balance & numbers
        - Docs / 文档
        - Other / 其他
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: 自检清单 / Checklist
      description: |
        勾选以下选项有助于我们更快处理该请求。
        Checking these helps us process the request faster.
      options:
        - label: 我已搜索现有 Issues，确认该功能未被提出过 / I searched existing issues and found no duplicate
          required: true
        - label: 我了解并接受该功能可能被调整或否决 / I understand and agree this feature may be modified or rejected
          required: true
        - label: 该功能符合修仙世界观与整体风格 / This feature fits the cultivation theme and lore
          required: true
        - label: 我已考虑基础平衡性（消耗、限制、风险）/ I considered basic balance factors
          required: true
        - label: 我愿意协助测试或提交 PR / I’m willing to help test or submit a PR
          required: false

  - type: textarea
    id: additional
    attributes:
      label: 补充说明 / Additional Context
      description: |
        可在此补充参考作品、截图、数值设想或灵感来源。
        Add references, screenshots, balance ideas, or inspirations here.
      placeholder: |
        例如：小说、动漫、其他修仙模组、数值或机制草案等。 / For example: novels, anime, other immortal cultivation mods, drafts of numerical values or mechanics, etc.

