name: 🐞 Report a Bug / 问题反馈
description: 提交 Bug 或异常行为 | Report a bug or unexpected behavior
title: "[Bug] 简要描述问题 | Brief description"
labels:
  - bug
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## Report a Bug / 问题反馈
        感谢你的反馈！请尽量填写完整信息，这将有助于我们更快定位和解决问题。
        Thank you for reporting this issue! Please provide as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: 问题描述 / Description
      description: |
        请清晰、简要地描述你遇到的问题。
        Please provide a clear and concise description of the issue.
      placeholder: 描述问题… / Describe the issue…
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to Reproduce
      description: |
        请列出可以稳定复现该问题的步骤。
        List the steps to reproduce the behavior.
      placeholder: |
        1. 
        2. 
        3. 
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为 / Expected Behavior
      description: |
        描述你期望发生什么。
        What did you expect to happen?
      placeholder: 期望的结果… / Expected result…
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为 / Actual Behavior
      description: |
        描述实际发生了什么。
        What actually happened?
      placeholder: 实际的结果… / Actual result…
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 截图 & 日志 / Screenshots or Logs
      description: |
        如有，请附上截图、报错信息或日志。
        If applicable, add screenshots, error messages, or logs.
      placeholder: 拖拽图片或粘贴日志… / Paste logs or screenshots here…

  - type: input
    id: os
    attributes:
      label: 操作系统 / OS
      placeholder: e.g. Windows 11 / macOS 14 / Ubuntu 22.04
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: 软件版本 / Version
      placeholder: e.g. v1.2.3
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 补充说明 / Additional Context
      description: |
        任何其他有助于理解或解决问题的信息。
        Add any other context that may help.
      placeholder: 其他信息… / Any additional context…
