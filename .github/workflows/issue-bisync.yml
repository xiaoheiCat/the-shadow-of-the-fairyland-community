name: Bi-sync Issues

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, assigned, unassigned, milestoned, demilestoned]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: bisync-${{ github.repository }}-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App installation token (cross-repo)
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ vars.SYNC_APP_OWNER }}
          repositories: ${{ vars.SYNC_REPOS }}

      - name: Bi-sync issues & comments
        uses: actions/github-script@v7
        env:
          SYNC_PEER_REPO: ${{ vars.SYNC_PEER_REPO }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            // github-script@v7 注入：core / github / context

            const peerRepoFull = process.env.SYNC_PEER_REPO; // "owner/repo"
            if (!peerRepoFull || !peerRepoFull.includes("/")) {
              core.setFailed("Missing/invalid vars.SYNC_PEER_REPO (expected owner/repo).");
              return;
            }
            const [peerOwner, peerRepo] = peerRepoFull.split("/");

            const selfOwner = context.repo.owner;
            const selfRepo  = context.repo.repo;

            const payloadIssue = context.payload.issue;
            if (!payloadIssue) {
              core.info("No issue in event payload; nothing to do.");
              return;
            }

            const isCommentEvent = !!context.payload.comment;

            // ---------- 标记 ----------
            const PEER_RE   = /<!--\s*sync-peer:([A-Za-z0-9_.-]+)\/([A-Za-z0-9_.-]+)#(\d+)\s*-->/g;
            const WRITE_RE  = /<!--\s*sync-write:[\s\S]*?-->/g;
            const ORIGIN_RE = /<!--\s*sync-origin:([A-Za-z0-9_.-]+)\|([^\s]+)\s*-->/g;
            const COMMENT_ID_RE = /<!--\s*sync-comment-id:\d+\s*-->/g;

            function buildPeerMark(owner, repo, number) {
              return `<!-- sync-peer:${owner}/${repo}#${number} -->`;
            }
            function buildWriteTag(text) {
              return `<!-- sync-write:${text} -->`;
            }
            function buildOriginMark(login, url) {
              return `<!-- sync-origin:${login}|${url} -->`;
            }
            function hasSyncWriteTag(text) {
              return !!text && /<!--\s*sync-write:/.test(text);
            }

            // ✅ 防循环：评论事件只看 comment；issue 事件才看 issue.body
            if (isCommentEvent) {
              if (hasSyncWriteTag(context.payload.comment?.body)) {
                core.info("Skip: comment contains sync-write tag.");
                return;
              }
            } else {
              if (hasSyncWriteTag(payloadIssue.body)) {
                core.info("Skip: issue body contains sync-write tag.");
                return;
              }
            }

            // ---------- API helpers ----------
            async function getIssue(owner, repo, number) {
              const { data } = await github.rest.issues.get({ owner, repo, issue_number: number });
              return data;
            }
            async function updateIssue(owner, repo, number, patch) {
              await github.rest.issues.update({ owner, repo, issue_number: number, ...patch });
            }
            async function createIssue(owner, repo, payload) {
              const { data } = await github.rest.issues.create({ owner, repo, ...payload });
              return data;
            }
            async function listAllComments(owner, repo, number) {
              const all = [];
              let page = 1;
              while (true) {
                const { data } = await github.rest.issues.listComments({
                  owner, repo, issue_number: number, per_page: 100, page
                });
                all.push(...data);
                if (data.length < 100) break;
                page++;
              }
              return all;
            }

            function normalizeLabels(issue) {
              return (issue.labels || []).map(l => (typeof l === "string" ? l : l.name)).filter(Boolean);
            }
            function normalizeAssignees(issue) {
              return (issue.assignees || []).map(a => a.login).filter(Boolean);
            }
            function milestoneNumber(issue) {
              return issue.milestone ? issue.milestone.number : null;
            }

            function userToLoginUrl(user) {
              const login = user?.login || "unknown";
              const url = user?.html_url || `https://github.com/${login}`;
              return { login, url };
            }

            function authorPrefix(login, url) {
              // 你要求的格式（带冒号）
              return `[${login}](${url}):`;
            }

            function syncedFromLine(owner, repo, number) {
              return `> Synced from ${owner}/${repo}#${number}`;
            }

            // ---------- 关键：解析/固定 origin author ----------
            function extractOrigin(body) {
              if (!body) return null;
              const ms = [...body.matchAll(ORIGIN_RE)];
              if (ms.length === 0) return null;
              // 取最后一个，避免历史残留
              const m = ms[ms.length - 1];
              return { login: m[1], url: m[2] };
            }

            // ---------- 关键：剥离“我们管理的内容”，避免前缀叠加 ----------
            function stripLeadingAuthorPrefix(text) {
              if (!text) return text;
              const lines = text.split("\n");
              // 匹配类似：[user](https://github.com/user):
              const first = (lines[0] || "").trim();
              if (/^\[[^\]]+\]\((https?:\/\/[^\)]+)\):?$/.test(first) || /^[A-Za-z0-9_.-]+\[bot\]:?$/.test(first)) {
                // 去掉第一行，以及紧跟的一个空行
                lines.shift();
                if ((lines[0] || "").trim() === "") lines.shift();
              }
              return lines.join("\n").trim();
            }

            function stripManagedFromIssueBody(body) {
              let b = body || "";
              b = b.replace(WRITE_RE, "");
              b = b.replace(PEER_RE, "");
              b = b.replace(ORIGIN_RE, "");
              b = b.replace(COMMENT_ID_RE, "");

              // 去掉我们 footer（--- + Synced from）
              b = b.replace(/\n---\n(?:[^\n]*\n)*?>\s*Synced from[^\n]*\n?([\s\S]*)?$/m, "\n");
              b = b.replace(/^>\s*Synced from.*$/gm, "");

              b = stripLeadingAuthorPrefix(b);
              return b.trim();
            }

            // ---------- peer 映射：优先选指向 vars.SYNC_PEER_REPO 的 ----------
            function extractPeerPreferred(body) {
              if (!body) return null;
              const matches = [];
              for (const m of body.matchAll(PEER_RE)) {
                matches.push({ owner: m[1], repo: m[2], number: Number(m[3]) });
              }
              if (matches.length === 0) return null;

              const preferred = matches.find(x => x.owner === peerOwner && x.repo === peerRepo);
              if (preferred) return preferred;

              const notSelf = matches.find(x => !(x.owner === selfOwner && x.repo === selfRepo));
              if (notSelf) return notSelf;

              return matches[0];
            }

            // ---------- 取最新源 issue ----------
            const srcNumber = payloadIssue.number;
            const freshSrc = await getIssue(selfOwner, selfRepo, srcNumber);

            const runWriteTag = buildWriteTag(`${selfOwner}/${selfRepo}#${srcNumber} run:${context.runId}`);

            // 确定 origin：优先 body 里的 sync-origin；没有就用当前 issue 的 user（第一次创建时是人）
            const originFromBody = extractOrigin(freshSrc.body);
            const fallbackOrigin = userToLoginUrl(freshSrc.user);
            const origin = originFromBody || fallbackOrigin;

            // ---------- 找/建对端 ----------
            let peerRef = extractPeerPreferred(freshSrc.body);

            if (peerRef && peerRef.owner === selfOwner && peerRef.repo === selfRepo) {
              core.setFailed(`sync-peer mapping points to self (${selfOwner}/${selfRepo}#${peerRef.number}). Check markers/vars.`);
              return;
            }

            function buildIssueBodyForTarget(srcIssue) {
              // 关键：作者用 origin，不用 srcIssue.user（避免 annshawn-bot 变作者）
              const main = stripManagedFromIssueBody(srcIssue.body || "");
              return [
                authorPrefix(origin.login, origin.url),
                "",
                main,
                "",
                "---",
                syncedFromLine(selfOwner, selfRepo, srcNumber)
              ].join("\n").trim();
            }

            let peerIssue;
            if (!peerRef) {
              core.info("No peer mapping found. Creating peer issue...");

              const createMain = buildIssueBodyForTarget(freshSrc);

              // 对端 body 末尾只保留：origin + back peer + write
              const body = [
                createMain,
                "",
                buildOriginMark(origin.login, origin.url),
                buildPeerMark(selfOwner, selfRepo, srcNumber),
                runWriteTag
              ].join("\n").trim();

              const createPayload = { title: freshSrc.title, body };
              try { createPayload.labels = normalizeLabels(freshSrc); } catch {}
              try { createPayload.assignees = normalizeAssignees(freshSrc); } catch {}
              try { createPayload.milestone = milestoneNumber(freshSrc); } catch {}

              peerIssue = await createIssue(peerOwner, peerRepo, createPayload);

              // 写回源 issue：仅追加 origin + toPeer + write（避免污染正文）
              const cleanedSrc = stripManagedFromIssueBody(freshSrc.body || "");
              const newSrcBody = [
                cleanedSrc,
                "",
                buildOriginMark(origin.login, origin.url),
                buildPeerMark(peerOwner, peerRepo, peerIssue.number),
                runWriteTag
              ].join("\n").trim();

              await updateIssue(selfOwner, selfRepo, srcNumber, { body: newSrcBody });

              peerRef = { owner: peerOwner, repo: peerRepo, number: peerIssue.number };
              core.info(`Created peer: ${peerOwner}/${peerRepo}#${peerIssue.number}`);
            } else {
              peerIssue = await getIssue(peerRef.owner, peerRef.repo, peerRef.number);
              core.info(`Found peer: ${peerRef.owner}/${peerRef.repo}#${peerRef.number}`);
            }

            // ---------- 同步 issue 字段 ----------
            async function syncIssueFields(srcIssue, dstRef) {
              const main = buildIssueBodyForTarget(srcIssue);
              const dstBody = [
                main,
                "",
                buildOriginMark(origin.login, origin.url),
                buildPeerMark(selfOwner, selfRepo, srcNumber),
                runWriteTag
              ].join("\n").trim();

              const patch = { title: srcIssue.title, body: dstBody, state: srcIssue.state };

              try { patch.labels = normalizeLabels(srcIssue); } catch {}
              try { patch.assignees = normalizeAssignees(srcIssue); } catch {}
              try { patch.milestone = milestoneNumber(srcIssue); } catch {}

              await updateIssue(dstRef.owner, dstRef.repo, dstRef.number, patch);
            }

            // ---------- 同步评论（作者前缀 + Synced from + 去重） ----------
            function commentTag(id) {
              return `<!-- sync-comment-id:${id} -->`;
            }

            async function syncComments(srcRef, dstRef) {
              const srcComments = await listAllComments(srcRef.owner, srcRef.repo, srcRef.number);
              const dstComments = await listAllComments(dstRef.owner, dstRef.repo, dstRef.number);
            
              // 建立：srcCommentId -> dstComment
              const map = new Map();
              for (const dc of dstComments) {
                const m = (dc.body || "").match(/<!--\s*sync-comment-id:(\d+)\s*-->/);
                if (m) map.set(Number(m[1]), dc);
              }
            
              for (const c of srcComments) {
                // 源评论若为同步写入则不再同步（防循环）
                if (hasSyncWriteTag(c.body || "")) continue;
            
                const srcId = c.id;
                const tag = `<!-- sync-comment-id:${srcId} -->`;
            
                const u = userToLoginUrl(c.user);
                const main = (c.body || "")
                  .replace(WRITE_RE, "")
                  .replace(/<!--\s*sync-comment-id:\d+\s*-->/g, "")
                  .trim();
            
                const desiredBody = [
                  authorPrefix(u.login, u.url),
                  "",
                  main,
                  "",
                  "---",
                  syncedFromLine(srcRef.owner, srcRef.repo, srcRef.number),
                  tag,
                  buildWriteTag(`${srcRef.owner}/${srcRef.repo}#${srcRef.number} comment run:${context.runId}`)
                ].join("\n").trim();
            
                const existing = map.get(srcId);
            
                if (!existing) {
                  // 不存在 -> 新建
                  await github.rest.issues.createComment({
                    owner: dstRef.owner,
                    repo: dstRef.repo,
                    issue_number: dstRef.number,
                    body: desiredBody
                  });
                } else {
                  // 已存在 -> 更新（只有内容变了才更新，减少噪音）
                  if ((existing.body || "").trim() !== desiredBody.trim()) {
                    await github.rest.issues.updateComment({
                      owner: dstRef.owner,
                      repo: dstRef.repo,
                      comment_id: existing.id,
                      body: desiredBody
                    });
                  }
                }
              }
            }

            const srcRef = { owner: selfOwner, repo: selfRepo, number: srcNumber };
            const dstRef = { owner: peerRef.owner, repo: peerRef.repo, number: peerRef.number };

            await syncIssueFields(freshSrc, dstRef);
            await syncComments(srcRef, dstRef);

            core.info(`Done: ${selfOwner}/${selfRepo}#${srcNumber} <-> ${dstRef.owner}/${dstRef.repo}#${dstRef.number}`);
